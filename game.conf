# ----- Craft & Ruin game manifest -----
name = Craft & Ruin
description = A Minecraft-inspired survival sandbox featuring copper-powered tech, palette-tinted foliage/grass, and biome-adaptive worldgen (Plains first).
author = Brandon Chaney & contributors
release = 0.1.0 (alpha)

# Mapgen policy: we target v7 right now.
allowed_mapgens = singlenode, v7
default_mapgen = singlenode
# Hide the flags for v6 so users don't see "jungles" or "trees" as options
#disallowed_mapgen_settings = mgv6_spflags, mg_flags

# Minimum engine (tested)
min_minetest_version = 5.14.0

# Optional: a short blurb for launchers
short_description = Survival sandbox with copper power & biome tinting.
