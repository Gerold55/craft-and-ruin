# =========================
# Cube_World defaults
# =========================

# --- Game & UI ---
#creative_mode = false
#enable_damage = true
#free_move = false
#fast_move = false
#disable_anticheat = false

# --- Performance / net ---
max_objects_per_block = 64
active_block_range = 3
active_object_send_range_blocks = 5
server_unload_unused_data_timeout = 600

# --- Mapgen (targeting v7) ---
mgname = singlenode
chunksize = 6
water_level = 8                 # MC-like sea level feel; adjust if you prefer
enable_mapgen_caves = true
enable_mapgen_dungeons = false
enable_mapgen_decorations = true

# v7 special flags: (set/clear as you like)
#   ridges: adds big mountain ridges; floatlands: sky islands
mgv7_spflags = ridges, norepeat

# If you want reproducible worlds, set a seed (otherwise leave blank to randomize)
#fixed_map_seed =

# --- Lighting / visuals ---
#enable_shaders = true
#tone_mapping = true
#smooth_lighting = true
#mip_map = true
#bilinear_filtering = true
#trilinear_filtering = true
#anisotropic_filtering = 8

#cw_grass_palette_min_idx = 4
#cw_grass_palette_max_idx = 11
#cw_grass_palette_gamma = 0.95

#cw_foliage_palette_min_idx = 3
#cw_foliage_palette_max_idx = 12
#cw_foliage_palette_gamma = 0.95

# --- cw_mobs ---
cw_mobs.firefly_spawn_step = 6.0
cw_mobs.firefly_plains_skip = 0.60
cw_mobs.firefly_scan_radius_xz = 18
cw_mobs.firefly_scan_radius_y = 8
cw_mobs.firefly_night_only = true

# Fewer world-light rays per flash
cw_mobs.firefly_flash_glow = 10     # was 13 (range 8–14)
cw_mobs.firefly_flash_time = 0.20   # was 0.35

# Fewer fireflies on screen
cw_mobs.firefly_view_cap   = 28     # was 45
cw_mobs.firefly_view_radius = 28    # was 32 (smaller search bubble)

# Spawn less in plains; scan less area (cheaper)
cw_mobs.firefly_plains_skip = 0.60  # was 0.35
cw_mobs.firefly_scan_radius_xz = 16 # was 20
cw_mobs.firefly_scan_radius_y  = 6  # was 9

# Slightly slower, cheaper animation/pulse
cw_mobs.firefly_glow_amp  = 2       # was 3
cw_mobs.firefly_glow_freq = 2.0     # was 2.7

cw_mobs.bee_anim_fps = 20
cw_mobs.bee_forage_r = 12
cw_mobs.bee_forage_dwell = 2.5
cw_mobs.bee_sting_damage = 2
cw_mobs.bee_aggro_seconds = 20
cw_mobs.hive_release_per_tick = 2
cw_mobs.hive_outside_cap = 10
cw_mobs.hive_outside_cap_radius = 10
cw_mobs.honey_tick_min = 30
cw_mobs.honey_tick_var = 10

# --- Logging (useful while developing) ---
#debug_log_level = action
#profiling = false

# --- Mods (usually not needed for games; games auto-enable their own mods)
# If testing outside a packaged game, uncomment to ensure our mods load:
#load_mod_cw_core = true
#load_mod_cw_mapgen = true

# --- Server bits (if you host) ---
#server_announce = false
#server_name = Cube_World Dev
#server_description = Cube_World playtest server
#motd = Welcome to Cube_World (alpha)
#default_privs = interact, shout

# --- Developer convenience ---
#enable_client_modding = true
#secure.trusted_mods =
